<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="description" content="Tire ou envie uma foto e estique, amasse e puxe a cara à vontade." />
    <title>Crazy Face</title>
  </head>
  <body>
    <header class="toolbar">
      <h1>Crazy Face</h1>
      <div class="controls">
        <label class="button primary">
          <input id="file" type="file" accept="image/*" hidden />
          Enviar foto
        </label>
        <label class="slider">
          Pincel
          <input id="radius" type="range" min="0.05" max="0.45" step="0.01" value="0.18" />
        </label>
        <label class="toggle">
          <input id="clay" type="checkbox" />
          Modo massinha
        </label>
        <label class="toggle">
          <input id="jelly" type="checkbox" />
          Modo gelatina
        </label>
        <button id="reset" class="button" type="button">Resetar</button>
        <button id="save" class="button" type="button">Salvar PNG</button>
        <button id="mute" class="button icon" type="button" aria-label="Desligar sons" title="Desligar sons">🔊</button>
      </div>
    </header>

    <main id="stage" class="stage">
      <canvas id="canvas"></canvas>
      <div id="brush" class="brush" hidden></div>
      <div class="effects" role="toolbar" aria-label="Efeitos malucos">
        <button class="button chip" type="button" data-effect="balloon">🎈 Balão</button>
        <button class="button chip" type="button" data-effect="fish">🐟 Cara de peixe</button>
        <button class="button chip" type="button" data-effect="twist">🌀 Rodamoinho</button>
        <button class="button chip" type="button" data-effect="melt">🫠 Derreter</button>
        <button class="button chip" type="button" data-effect="chaos">🎲 Caos</button>
      </div>
      <p id="caption" class="caption" aria-live="polite" hidden></p>
      <div id="bubble" class="bubble" hidden></div>
      <p id="hint" class="hint">Arraste a cara para esticar. Solte ou cole uma foto para usar a sua.</p>
      <div id="drop" class="drop" hidden>Solte sua foto aqui</div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
